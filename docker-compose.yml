# Whole stack with one command:  docker compose up --build
#
#   postgres      :5433   (host port; avoids clashing with a local Postgres) two databases: marketplace (ours) and mock_banking (core banking)
#   core-banking  :8081   the Go mock core — built from a sibling clone at ../core-banking
#   backend       :4000   this repo's API marketplace backend (docs at /docs)
#
# Prerequisite: git clone https://github.com/Derakoptes/core-banking.git next to this repo.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Required by the Go core since its auth_api refactor (verification codes).
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  core-banking:
    build:
      context: ../core-banking
      dockerfile_inline: |
        FROM golang:1.27-alpine AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -o /out/server ./cmd && CGO_ENABLED=0 go build -o /out/seed ./cmd/seed
        FROM alpine:3.20
        COPY --from=build /out/server /out/seed /usr/local/bin/
        # config.Load() fatals without a .env file even when env vars are set; godotenv never overrides real env vars
        WORKDIR /app
        RUN touch /app/.env
        CMD ["sh", "-c", "seed && server"]
    environment:
      API_KEY: mockcore-api-key
      MOCKCORE_AUTH_ALLOW_ANONYMOUS: 'false'
      MOCKCORE_HTTP_ADDR: 0.0.0.0:8081
      MOCKCORE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/mock_banking?sslmode=disable
      MOCKCORE_DB_AUTO_MIGRATE: 'true'
      # Required since the auth_api refactor; the service refuses to boot without it.
      MOCKCORE_AUTH_VERIFICATION_SECRET: dev-only-verification-secret-change-me
      MOCKCORE_REDIS_ADDR: redis:6379
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      PORT: 4000
      # The image is a production build (npm ci --omit=dev, node dist/index.js), so
      # this stays 'production'. Note that means no pino-pretty in the container —
      # it is a devDependency, and 'development' here would fail to boot.
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/marketplace
      # Local-only values, but deliberately NOT the placeholder patterns config.ts
      # rejects in production — that guard has to stay able to fire for real.
      # Rotate both for any deployment that is not this compose file.
      JWT_SECRET: local-demo-jwt-secret-8f2c42ae9b174d30
      CONSENT_UI_URL: http://localhost:3000/consent
      CORE_BANKING_URL: http://core-banking:8081
      CORE_BANKING_API_KEY: mockcore-api-key
      # 'memory' runs the small built-in dataset, so the stack works without the Go
      # core. Switch to the real service per run:
      #   CORE_BANKING_ADAPTER=http docker compose up -d backend
      CORE_BANKING_ADAPTER: ${CORE_BANKING_ADAPTER:-memory}
      # Hosts the sample fintech app's stand-in backend (/demo/*), so BudgetBuddy
      # can exchange its authorization code without the secret reaching a browser.
      # A real deployment leaves this off.
      DEMO_SAMPLE_APP: 'true'
      ADMIN_KEY: local-demo-admin-key-5d1b73c6
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      core-banking:
        condition: service_started

volumes:
  pgdata:
