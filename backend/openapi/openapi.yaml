openapi: 3.1.0
info:
  title: Open Banking API Marketplace
  version: 0.1.0
  description: |
    The bank's front door for third-party developers. Partners register an app on the
    developer portal, obtain customer consent through the OAuth 2.0 authorization code
    flow, and then read account data on the customer's behalf — scoped, revocable, and
    fully audited.

    **Flow**: `GET /oauth/authorize` → customer logs in and approves on the bank's consent
    page → your app receives `?code=` → `POST /oauth/token` → call `/api/v1/*` with the
    bearer token. The customer can revoke at any time; the next call then fails with
    `consent_revoked`.

    All errors (except `/oauth/token`, which follows RFC 6749) use the shape
    `{ "error": { "code", "message", "correlation_id" } }`.
servers:
  - url: http://localhost:4000
tags:
  - name: OAuth
    description: Partner-facing authorization endpoints
  - name: Accounts
    description: Account information APIs (require a consented access token)
  - name: Bank UI
    description: Used only by the bank's own consent pages — not for partners
  - name: Portal
    description: Developer self-service. Sign up, register apps, manage credentials.
  - name: Analytics
    description: Admin dashboard data. Requires the `X-Admin-Key` header; never exposed to partners.
  - name: Demo
    description: >-
      The sample fintech app's own backend, not the bank's. Present only where
      DEMO_SAMPLE_APP is enabled; everywhere else these paths return 404.
  - name: Platform

paths:
  /health:
    get:
      tags: [Platform]
      summary: Liveness and dependency check
      responses:
        '200': { description: Healthy }
        '503': { description: A dependency is down }

  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: Start the consent flow
      description: |
        Redirect the customer's browser here. We create a consent request and forward the
        customer to the bank's consent page. Add `format=json` (or `Accept: application/json`)
        to receive the consent URL as JSON instead of a 302.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - name: scope
          in: query
          required: true
          description: Space-separated. Any of `accounts:read`, `balances:read`, `transactions:read`.
          schema: { type: string, example: 'accounts:read balances:read transactions:read' }
        - { name: state, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json] } }
      responses:
        '302': { description: Redirect to the bank consent page (or back to redirect_uri with `error=invalid_scope`) }
        '201':
          description: JSON form
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent_id: { type: string, format: uuid }
                  consent_url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }

  /oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange an authorization code for an access token
      description: Client authentication via HTTP Basic (`client_id:client_secret`) or form fields.
      security: [{ clientBasic: [] }, {}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 86400 }
                  scope: { type: string }
                  consent_id: { type: string, format: uuid }
        '400':
          description: RFC 6749 error (`invalid_grant`, `invalid_request`, `unsupported_grant_type`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List the accounts the customer chose to share
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Account' } }
                  meta: { type: object, properties: { consent_id: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get one account
      security: [{ bearerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Account' } } }
        '404': { description: Not found, or not one of the consented accounts }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }


  /api/v1/accounts/{accountId}/balances:
    get:
      tags: [Accounts]
      summary: Balances for one consented account
      description: Requires the `balances:read` scope.
      security: [{ bearerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/accountId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Balance' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Not found, or not one of the consented accounts }

  /api/v1/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      summary: Transactions for one consented account
      description: |
        Requires the `transactions:read` scope. Paginated with an opaque cursor: pass
        `meta.pagination.next_cursor` back as `cursor` to fetch the next page.
      security: [{ bearerToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/accountId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `meta.pagination.next_cursor`
          schema: { type: string }
        - name: from
          in: query
          description: ISO 8601 date or date-time
          schema: { type: string, example: '2026-01-01' }
        - name: to
          in: query
          description: ISO 8601 date or date-time
          schema: { type: string, example: '2026-01-31' }
        - name: type
          in: query
          schema: { type: string, enum: [credit, debit] }
        - name: sort
          in: query
          description: Defaults to newest first
          schema: { type: string, enum: [booked_at_desc, booked_at_asc] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { description: Not found, or not one of the consented accounts }

  /portal/apps/{id}:
    patch:
      tags: [Portal]
      summary: Edit an app (name, description, redirect URIs, identity shown on the consent screen)
      security: [{ portalToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                redirect_uris: { type: array, items: { type: string, format: uri } }
                website_url: { type: string, format: uri, nullable: true }
                privacy_policy_url: { type: string, format: uri, nullable: true }
                logo_url: { type: string, format: uri, nullable: true }
      responses:
        '200': { description: Updated app }
        '400': { $ref: '#/components/responses/Error' }
        '404': { description: Not one of your apps }

  /bank/logout:
    post:
      tags: [Bank UI]
      summary: End the bank session server-side
      security: [{ bankSession: [] }]
      responses:
        '204': { description: Logged out }

  /bank/login:
    post:
      tags: [Bank UI]
      summary: Internet-banking login (delegated to the core banking identity provider)
      description: |
        The marketplace never stores customer passwords. Five failed attempts lock the username for
        15 minutes (`423 account_locked`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties: { username: { type: string, example: ada }, password: { type: string, example: adaeze-ada-okonkwo } }
      responses:
        '200':
          description: 'Session issued. Send as `Authorization: Bearer <session_token>` to the other Bank UI endpoints.'
        '401': { $ref: '#/components/responses/Error' }

  /bank/me:
    get:
      tags: [Bank UI]
      summary: Current logged-in customer
      security: [{ bankSession: [] }]
      responses:
        '200': { description: OK }

  /bank/consents/{id}:
    get:
      tags: [Bank UI]
      summary: Consent request details + the customer's accounts (for the consent screen)
      description: |
        Opening a pending request binds it to the logged-in customer; any other customer then
        gets 404. Requests not acted on within `CONSENT_REQUEST_TTL_MINUTES` (default 15) expire.
      security: [{ bankSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK }
        '404': { description: Not found, or belongs to another customer }
        '410': { description: '`consent_request_expired` — the customer took too long; the app must start again' }

  /bank/consents/{id}/authorise:
    post:
      tags: [Bank UI]
      summary: Customer approves and selects accounts
      security: [{ bankSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties: { account_ids: { type: array, items: { type: string }, minItems: 1 } }
      responses:
        '200':
          description: Approved. Send the browser to `redirect_to`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent_id: { type: string }
                  status: { type: string, example: authorised }
                  expires_at: { type: string, format: date-time }
                  redirect_to: { type: string, format: uri }
        '404': { description: Not found, or belongs to another customer }
        '409': { description: Consent is no longer pending }
        '410': { description: '`consent_request_expired`' }

  /bank/consents/{id}/reject:
    post:
      tags: [Bank UI]
      summary: Customer declines
      security: [{ bankSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Rejected. Send the browser to `redirect_to` (carries `error=access_denied`). }

  /bank/connected-apps:
    get:
      tags: [Bank UI]
      summary: Apps the customer has granted access to
      security: [{ bankSession: [] }]
      responses:
        '200': { description: OK }

  /bank/connected-apps/{consentId}/revoke:
    post:
      tags: [Bank UI]
      summary: Revoke an app's access. The app's next API call fails immediately.
      security: [{ bankSession: [] }]
      parameters: [{ name: consentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Revoked }
        '404': { description: No active consent with that id for this customer }

  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Headline tiles — traffic, error rate, p95 latency, consent counts
      security: [{ adminKey: [] }, { portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string, example: 24h }
                  calls: { type: integer }
                  errors: { type: integer }
                  client_errors: { type: integer, description: Status 400–499 }
                  server_errors: { type: integer, description: Status 500 and above }
                  error_rate: { type: number, example: 0.1667, description: Ratio of calls with status >= 400 }
                  p95_latency_ms: { type: integer }
                  avg_latency_ms: { type: integer }
                  active_consents: { type: integer }
                  new_consents: { type: integer, description: Consents authorised within the window }
                  revocations: { type: integer, description: Consents revoked within the window }
                  total_consents: { type: integer }
                  developers: { type: integer, description: Registered developer accounts, excluding bank staff }
                  clients_total: { type: integer }
                  clients_active: { type: integer }
                  clients_calling: { type: integer, description: Distinct clients that called within the window }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { description: Signed in, but the account is not an administrator }

  /analytics/calls-per-client:
    get:
      tags: [Analytics]
      summary: Traffic broken down by registered client
      description: Every registered client is listed, including those with no traffic yet.
      security: [{ adminKey: [] }, { portalToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id: { type: string, example: budgetbuddy }
                        name: { type: string, example: BudgetBuddy }
                        status: { type: string, enum: [active, deactivated] }
                        calls: { type: integer }
                        errors: { type: integer }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/developers:
    get:
      tags: [Analytics]
      summary: The partner register — every developer account and its apps
      description: >-
        Developer accounts (staff accounts excluded), each with the apps registered under it, all-time
        traffic, live consents and last activity. Busiest first.
      security: [{ adminKey: [] }, { portalToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string, example: dev@budgetbuddy.example }
                        name: { type: string, example: Demo Developer }
                        company: { type: string, nullable: true, example: BudgetBuddy Ltd }
                        created_at: { type: string, format: date-time }
                        apps_total: { type: integer }
                        apps_active: { type: integer }
                        calls: { type: integer }
                        errors: { type: integer }
                        active_consents: { type: integer }
                        last_call_at: { type: string, format: date-time, nullable: true }
                        apps:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              client_id: { type: string, example: budgetbuddy }
                              name: { type: string, example: BudgetBuddy }
                              status: { type: string, enum: [active, deactivated] }
                              created_at: { type: string, format: date-time }
                              deactivated_at: { type: string, format: date-time, nullable: true }
                              calls: { type: integer }
                              active_consents: { type: integer }
                              last_call_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/top-endpoints:
    get:
      tags: [Analytics]
      summary: Busiest partner endpoints
      description: |
        Only the partner surface (`/api/v1/*`) is counted — the bank's own consent pages and
        the developer portal are not products anyone consumes. Account ids are collapsed back
        to `{accountId}`, and CORS preflights are excluded.
      security: [{ adminKey: [] }, { portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string, example: 24h }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string, example: '/api/v1/accounts/{accountId}/balances' }
                        method: { type: string, example: GET }
                        calls: { type: integer }
                        errors: { type: integer }
                        p95_latency_ms: { type: integer }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/endpoints:
    get:
      tags: [Analytics]
      summary: Usage of every product route in a window
      description: >-
        Like top-endpoints but unbounded and including the OAuth routes, so the admin catalogue can attribute
        usage to every product, consent included. Account ids are collapsed to {accountId}.
      security: [{ adminKey: [] }, { portalToken: [] }]
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string, example: /api/v1/accounts/{accountId}/balances }
                        method: { type: string, example: GET }
                        calls: { type: integer }
                        errors: { type: integer }
                        p95_latency_ms: { type: integer }
                        partners: { type: integer, description: Distinct clients that called the route }
                        last_call_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/timeseries:
    get:
      tags: [Analytics]
      summary: Calls per 5-minute bucket
      description: Empty buckets are included so the chart has a continuous x-axis.
      security: [{ adminKey: [] }, { portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string, example: 24h }
                  bucket_seconds: { type: integer, example: 300 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket: { type: string, format: date-time }
                        calls: { type: integer }
                        errors: { type: integer }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/recent-calls:
    get:
      tags: [Analytics]
      summary: Live audit feed, newest first
      security: [{ adminKey: [] }, { portalToken: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: errors_only
          in: query
          description: Show only calls the gateway rejected (status 400 and above).
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - name: include_internal
          in: query
          description: |
            By default the feed shows the traffic this dashboard oversees — partner API calls and
            the consent journey (`/api/v1`, `/oauth`, `/bank`). The management plane (`/analytics`,
            `/portal`) and CORS preflights are excluded so an open portal does not bury partner
            traffic. Set true to see everything.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiCall' } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /analytics/consents:
    get:
      tags: [Analytics]
      summary: Consent counts by status
      description: All five statuses are always present, with zero counts where applicable.
      security: [{ adminKey: [] }, { portalToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [awaiting_authorisation, authorised, rejected, revoked, expired]
                        count: { type: integer }
                  total: { type: integer }
                  recent:
                    type: array
                    description: The twelve most recently touched consents — who granted or withdrew access, and to whom.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string }
                        customer_id: { type: string }
                        scopes: { type: array, items: { type: string } }
                        account_count: { type: integer, nullable: true }
                        sandbox: { type: boolean }
                        authorised_at: { type: string, format: date-time, nullable: true }
                        revoked_at: { type: string, format: date-time, nullable: true }
                        revoked_by: { type: string, nullable: true, example: customer }
                        created_at: { type: string, format: date-time }
                        client_id: { type: string }
                        client_name: { type: string }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }

  /portal/signup:
    post:
      tags: [Portal]
      summary: Create a developer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                company: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer: { $ref: '#/components/schemas/Developer' }
                  portal_token: { type: string, description: Bearer token for the other Portal endpoints }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: '`code` is `email_taken`' }

  /portal/login:
    post:
      tags: [Portal]
      summary: Log in to the developer portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer: { $ref: '#/components/schemas/Developer' }
                  portal_token: { type: string }
        '401': { description: '`code` is `invalid_credentials`' }

  /portal/apps:
    get:
      tags: [Portal]
      summary: List your registered apps
      security: [{ portalToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PortalApp' } }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
    post:
      tags: [Portal]
      summary: Register an app and receive credentials
      description: |
        The `client_secret` in this response is shown **once**. Only its bcrypt hash is
        stored, so it cannot be retrieved again — use rotate-secret to replace a lost one.
      security: [{ portalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string }
                description: { type: string }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: uri }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PortalApp'
                  - type: object
                    properties:
                      client_secret: { type: string, description: Shown once and never again }
                      warning: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }

  /portal/apps/{id}/rotate-secret:
    post:
      tags: [Portal]
      summary: Issue a new client secret
      description: The previous secret stops working immediately. Existing consents are untouched.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/appId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PortalApp'
                  - type: object
                    properties:
                      client_secret: { type: string }
                      warning: { type: string }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
        '404': { description: No such app under your account }
        '409': { description: '`code` is `client_deactivated`' }

  /portal/apps/{id}/deactivate:
    post:
      tags: [Portal]
      summary: Kill an app and every consent under it
      description: |
        The blast-radius switch. Sets the client to `deactivated` and revokes every consent
        customers granted it, so every access token issued under that client fails on its
        very next call with `client_deactivated`. Safe to call more than once.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/appId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PortalApp'
                  - type: object
                    properties:
                      consents_revoked: { type: integer, description: How many consents this call killed }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
        '404': { description: No such app under your account }

  /portal/summary:
    get:
      tags: [Portal]
      summary: Your integration activity at a glance
      description: |
        The same `api_calls` audit trail the bank's dashboard reads, scoped to your own apps.
        You see what your integration did and nothing else — no other developer's traffic.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/portalWindow' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string, example: 24h }
                  calls: { type: integer }
                  errors: { type: integer }
                  client_errors: { type: integer }
                  server_errors: { type: integer }
                  error_rate: { type: number }
                  p95_latency_ms: { type: integer }
                  apps_total: { type: integer }
                  apps_active: { type: integer }
                  active_consents: { type: integer, description: Live customer consents across your apps }
                  sandbox_consents: { type: integer }
                  revoked_consents: { type: integer }
                  by_app:
                    type: array
                    items:
                      type: object
                      properties:
                        app_id: { type: string, format: uuid }
                        client_id: { type: string }
                        name: { type: string }
                        status: { type: string, enum: [active, deactivated] }
                        calls: { type: integer }
                        errors: { type: integer }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }

  /portal/logs:
    get:
      tags: [Portal]
      summary: Your request log, newest first
      description: |
        Every call your apps made through the gateway, with the `correlation_id` to quote
        when raising a support request. Paginated with a keyset cursor on the append-only
        audit trail, so a cursor never goes stale.
      security: [{ portalToken: [] }]
      parameters:
        - { name: app_id, in: query, description: Limit to one of your apps, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: '`errors` covers everything from 400 up.'
          schema: { type: string, enum: ['2xx', '4xx', '5xx', errors] }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, description: From a previous response's `meta.pagination.next_cursor`, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        correlation_id: { type: string }
                        app_id: { type: string, format: uuid }
                        client_id: { type: string }
                        app_name: { type: string }
                        consent_id: { type: string, format: uuid, nullable: true }
                        method: { type: string }
                        path: { type: string }
                        status_code: { type: integer }
                        error_code: { type: string, nullable: true }
                        duration_ms: { type: integer }
                        created_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }

  /portal/apps/{id}/sandbox:
    get:
      tags: [Portal]
      summary: Sandbox state for an app
      description: The demo customer backing sandbox tokens, their accounts, and the current sandbox consent if one exists.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/appId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id: { type: string, example: customer-demo-001 }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id: { type: string }
                        account_type: { type: string }
                        currency: { type: string }
                        status: { type: string }
                  consent: { $ref: '#/components/schemas/SandboxConsent' }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
        '404': { description: No such app under your account }

  /portal/apps/{id}/sandbox-token:
    post:
      tags: [Portal]
      summary: Mint a sandbox access token
      description: |
        A real access token for your app, bound to a pre-authorised consent for a demo customer.
        It goes through exactly the same checks as a token from the OAuth flow, so what you see
        in the sandbox is what your production integration will see. Creates the sandbox consent
        on first use.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/appId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SandboxConsent'
                  - type: object
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      expires_in: { type: integer, example: 86400 }
                      scope: { type: string, example: 'accounts:read balances:read transactions:read' }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
        '404': { description: No such app under your account }
        '409': { description: The app is deactivated and cannot be issued tokens }

  /portal/apps/{id}/sandbox/revoke:
    post:
      tags: [Portal]
      summary: Simulate the customer withdrawing consent
      description: |
        Revokes the app's sandbox consents so you can see exactly what your integration gets
        when a customer takes access back: the next call with the same token returns
        403 `consent_revoked`. Mint a new sandbox token to carry on.
      security: [{ portalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/appId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents_revoked: { type: integer }
        '401': { $ref: '#/components/responses/PortalUnauthorized' }
        '404': { description: No such app under your account }

  /demo/sample-app:
    get:
      tags: [Demo]
      summary: What the sample app needs to start a connection
      description: Returns 404 unless `DEMO_SAMPLE_APP` is enabled.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, example: budgetbuddy }
                  scopes: { type: array, items: { type: string } }
                  authorize_url: { type: string, example: /oauth/authorize }
        '404': { description: The demo endpoints are not enabled here }

  /demo/sample-app/token:
    post:
      tags: [Demo]
      summary: Exchange the sample app's authorization code
      description: |
        Stands in for the fintech's own server. The sample app runs in the browser, but the
        token exchange needs a client secret — so it happens here instead, exactly as it would
        on the partner's machine. Only ever acts for the one seeded demo client, and returns
        404 unless `DEMO_SAMPLE_APP` is enabled.

        This is not part of the bank's product surface. Partners use `POST /oauth/token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string, description: Single-use code from the bank redirect }
                redirect_uri: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 86400 }
                  scope: { type: string }
                  consent_id: { type: string, format: uuid }
        '400': { description: '`invalid_grant`, `invalid_redirect_uri` or `demo_client_unavailable`' }
        '404': { description: The demo endpoints are not enabled here }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /oauth/token`
    clientBasic:
      type: http
      scheme: basic
      description: '`client_id:client_secret`'
    bankSession:
      type: http
      scheme: bearer
      description: Session token from `POST /bank/login`
    portalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal token from `POST /portal/signup` or `POST /portal/login`
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: |
        Shared admin key for the analytics dashboard. Intended for scripts and smoke tests.
        The dashboard UI signs in instead and sends a `portalToken` whose account has the
        `admin` role, so the shared key never ships to a browser.
  parameters:
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, example: acct-demo-001 }
    appId:
      name: id
      in: path
      required: true
      description: The app's internal id (the `id` field, not `client_id`)
      schema: { type: string, format: uuid }
    window:
      name: window
      in: query
      description: Reporting window. Chart buckets scale with it, so a series is always 60–170 points.
      schema:
        type: string
        enum: ['1h', '6h', '24h', '7d', '30d']
        default: '24h'
    portalWindow:
      name: window
      in: query
      schema:
        type: string
        enum: ['1h', '24h', '7d', '30d']
        default: '24h'
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PortalUnauthorized:
      description: '`code` is `portal_token_required`, `invalid_portal_token` or `portal_token_expired`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminUnauthorized:
      description: |
        `code` is `admin_key_required` (no credential at all), `invalid_admin_key`,
        or one of the portal token codes. A valid portal token whose account is not
        an admin gets 403 `admin_required` instead.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Per-client quota exceeded (`code` is `rate_limited`). The quota is keyed on the
        client_id in your access token, so it is not shared with other partners.
        See the `RateLimit` response header for the current limit, remaining and reset.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Consent problem. `code` is one of `consent_revoked`, `consent_expired`,
        `consent_not_authorised`, `client_deactivated`, `insufficient_scope`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: consent_revoked }
            message: { type: string }
            correlation_id: { type: string }
            details: {}
    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_grant }
        error_description: { type: string }
    Account:
      type: object
      properties:
        account_id: { type: string, example: acct-demo-001 }
        account_number_masked: { type: string, example: '****0001' }
        account_type: { type: string, example: current }
        currency: { type: string, example: NGN }
        status: { type: string, example: active }
        opened_at: { type: string, format: date-time }
    Balance:
      type: object
      properties:
        account_id: { type: string }
        type: { type: string, example: available }
        amount: { type: string, example: '1250500.50' }
        currency: { type: string }
        credit_limit: { type: string }
        as_of: { type: string, format: date-time }
    Transaction:
      type: object
      properties:
        transaction_id: { type: string }
        account_id: { type: string }
        type: { type: string, enum: [credit, debit] }
        amount: { type: string }
        currency: { type: string }
        reference: { type: string }
        narration: { type: string }
        counterparty: { type: string }
        booked_at: { type: string, format: date-time }
        value_date: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        limit: { type: integer, example: 2 }
        has_more: { type: boolean }
        next_cursor: { type: string, description: Pass back as `cursor` to fetch the next page }
    ApiCall:
      type: object
      description: One audited request through the gateway.
      properties:
        id: { type: string }
        correlation_id: { type: string }
        client_id: { type: [string, 'null'], description: Null for unauthenticated calls }
        client_name: { type: [string, 'null'] }
        consent_id: { type: [string, 'null'] }
        customer_id: { type: [string, 'null'] }
        method: { type: string, example: GET }
        path: { type: string, example: /api/v1/accounts, description: Query string stripped }
        status_code: { type: integer, example: 403 }
        error_code: { type: [string, 'null'], example: consent_revoked }
        duration_ms: { type: integer }
        ip: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Developer:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        company: { type: [string, 'null'] }
        role:
          type: string
          enum: [developer, admin]
          description: |
            `admin` is bank staff, and is the only role the analytics dashboard admits.
            Self-service signup always creates a `developer`.
        created_at: { type: string, format: date-time }
    SandboxConsent:
      type: object
      nullable: true
      description: A pre-authorised consent for the demo customer, flagged `sandbox` so dashboards can tell it apart.
      properties:
        consent_id: { type: string, format: uuid }
        status: { type: string, example: authorised }
        scopes: { type: array, items: { type: string } }
        account_ids: { type: array, items: { type: string } }
        customer_id: { type: [string, 'null'] }
        authorised_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    PortalApp:
      type: object
      description: A registered app. The client secret is never part of this shape.
      properties:
        id: { type: string, format: uuid, description: Internal id, used in portal URLs }
        client_id: { type: string, example: cl_8Fq2ZtR1vKmN4xPd }
        name: { type: string }
        description: { type: [string, 'null'] }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        allowed_scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, deactivated] }
        created_at: { type: string, format: date-time }
        deactivated_at: { type: [string, 'null'], format: date-time }
